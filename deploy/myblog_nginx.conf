# ============================================================
# MyBlog Nginx 配置
# 适用环境: 宝塔面板 / 原生 Nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;  # ← 改成你的域名或服务器IP

    charset utf-8;
    client_max_body_size 50m;     # 允许上传最大 50MB

    # ========== 前端静态文件 ==========
    root /www/wwwroot/myblog/frontend/dist;  # ← 改成你的实际路径
    index index.html;

    # SPA 路由：所有非文件、非API请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ========== API 反向代理到 Flask (5000端口) ==========
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ========== 本地文件访问 ==========
    location /uploads/ {
        alias /www/wwwroot/myblog/backend/uploads/;  # ← 改成你的路径
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri @flask;
    }

    location /music_uploads/ {
        alias /www/wwwroot/myblog/backend/music_uploads/;  # ← 改成你的路径
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri @flask;
    }

    # Flask 兜底
    location @flask {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========== 安全 ==========
    location ~ /\.             { deny all; access_log off; log_not_found off; }
    location ~ (\.env|\.pyc|__pycache__|\.git|venv) {
        deny all; access_log off; log_not_found off;
    }

    # ========== Gzip 压缩 ==========
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript image/svg+xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # ========== 日志 ==========
    access_log /www/wwwlogs/myblog_access.log;
    error_log  /www/wwwlogs/myblog_error.log;
}

